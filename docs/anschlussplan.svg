<text x="60" y="1540" font-size="30" font-weight="700" fill="#1a1a19" text-anchor="start">So geht's – Schritt für Schritt</text>
<text x="60" y="1580" font-size="21" font-weight="400" fill="#1a1a19" text-anchor="start">1. Batterie abklemmen.</text>
<text x="60" y="1612" font-size="21" font-weight="400" fill="#1a1a19" text-anchor="start">2. Das EINE Geberkabel auftrennen: Kombi-Seite → A, Geber-Seite → GEBER. B → Masse.</text>
<text x="60" y="1644" font-size="21" font-weight="400" fill="#1a1a19" text-anchor="start">   Alten ArduinoTog-Nano ausbauen; seine Leitungen → ÖL, TOG, ABS.</text>
<text x="60" y="1676" font-size="21" font-weight="400" fill="#1a1a19" text-anchor="start">3. +12 V (Zündungsplus, mit 1-A-Sicherung) und GND (Masse) anklemmen. Aderendhülsen verwenden!</text>
<text x="60" y="1708" font-size="21" font-weight="400" fill="#1a1a19" text-anchor="start">4. Batterie dran, Zündung an. Per USB am Laptop einmessen (LIESMICH: ohm / hier / speichern).</text>
<text x="60" y="1740" font-size="21" font-weight="400" fill="#1a1a19" text-anchor="start">Geber-Masse bleibt wie sie ist an der Karosserie. B: an Masse (oder an einen Masse-Pin des Kombis).</text></svg>